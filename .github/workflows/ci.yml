name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only so fork pull requests are safe: no secrets, no signing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  XCODE_VERSION: "26.4.1"
  XCODE_PROJECT: macos/Streamif.xcodeproj
  XCODE_SCHEME: Streamif
  DERIVED_DATA: ${{ github.workspace }}/.derived-data
  SPM_CACHE: ${{ github.workspace }}/.spm-cache
  # Fork pull requests have no certificates. If tests fail to launch the host
  # app, set CODE_SIGN_IDENTITY to "-" instead of dropping these.
  NO_SIGN: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGN_IDENTITY=
    CODE_SIGN_ENTITLEMENTS=
    DEVELOPMENT_TEAM=

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ runner.os }}-${{ runner.arch }}-xc${{ env.XCODE_VERSION }}-${{ hashFiles('macos/Streamif.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Streamif.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xc${{ env.XCODE_VERSION }}-

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_CACHE"

      - name: Build for testing (Debug, unsigned)
        run: |
          # shellcheck disable=SC2086  # $NO_SIGN is a list of build settings
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            $NO_SIGN \
            | xcbeautify --renderer github-actions

      - name: Run tests
        run: |
          # shellcheck disable=SC2086  # $NO_SIGN is a list of build settings
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            $NO_SIGN \
            | xcbeautify --renderer github-actions

      - name: Summarise test results
        if: always()
        run: |
          BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          if [ ! -d "$BUNDLE" ]; then
            echo "No .xcresult bundle was produced - the build probably failed before tests ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          xcrun xcresulttool get test-results summary --path "$BUNDLE" --format json \
            > "$RUNNER_TEMP/test-summary.json" 2>/dev/null || {
              echo "Could not read the result bundle with xcresulttool." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
          python3 - "$RUNNER_TEMP/test-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys

          with open(sys.argv[1]) as handle:
              data = json.load(handle)

          print("## Test results\n")
          print("| Result | Total | Passed | Failed | Skipped |")
          print("|---|---|---|---|---|")
          print("| {} | {} | {} | {} | {} |".format(
              data.get("result", "unknown"),
              data.get("totalTestCount", 0),
              data.get("passedTests", 0),
              data.get("failedTests", 0),
              data.get("skippedTests", 0),
          ))

          failures = data.get("testFailures") or []
          if failures:
              print("\n### Failures\n")
              for failure in failures:
                  name = failure.get("testName", "unknown test")
                  target = failure.get("targetName", "")
                  message = (failure.get("failureText") or "").strip().replace("\n", " ")
                  print("- **{}** ({}) - {}".format(name, target, message))
          PY

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  release-build:
    # The release pipeline is unattended, so a Release-only compile error would
    # first show up at tag time. Catch it on main, not on every pull request.
    name: Release configuration compiles
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-release-${{ runner.os }}-${{ runner.arch }}-xc${{ env.XCODE_VERSION }}-${{ hashFiles('macos/Streamif.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macos/Streamif.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ runner.arch }}-xc${{ env.XCODE_VERSION }}-

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Build (Release, unsigned)
        run: |
          # shellcheck disable=SC2086  # $NO_SIGN is a list of build settings
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            $NO_SIGN \
            | xcbeautify --renderer github-actions
