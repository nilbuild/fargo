name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (a leading v is stripped)"
        required: true
        type: string
      dry_run:
        description: "Build and sign only - no notarization, no GitHub release, no gh-pages push"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never cancel a release in flight: a half-published appcast is worse than a
# queued run.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}

    steps:
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            DRY_RUN="false"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version. Expected X.Y.Z or X.Y.Z-suffix."
            exit 1
          fi

          case "$VERSION" in
            *-*) PRERELEASE="true" ;;
            *)   PRERELEASE="false" ;;
          esac

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release preflight"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Pre-release | \`$PRERELEASE\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required secrets are configured
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          MISSING=""
          for NAME in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_APP_PASSWORD \
            APPLE_TEAM_ID \
            SPARKLE_PRIVATE_KEY
          do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
              echo "::error::Repository secret $NAME is not set."
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "Missing secrets:$MISSING"
            echo "Configure them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

          echo "All seven release secrets are present."

  release:
    name: Build, notarize and publish
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      XCODE_VERSION: "26.4.1"
      DIST_DIR: ${{ github.workspace }}/dist
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history so release notes can be diffed against the previous tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # The build bumps the version on this runner only. If that bump was never
      # committed, two releases can ship the same CFBundleVersion, and Sparkle
      # compares on exactly that, so clients stop seeing updates.
      - name: Check the committed project version matches the tag
        run: |
          COMMITTED=$(sed -n -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/p' \
            macos/Fargo.xcodeproj/project.pbxproj | head -n 1)
          BUILD_NUMBER=$(sed -n -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/p' \
            macos/Fargo.xcodeproj/project.pbxproj | head -n 1)
          echo "Committed: MARKETING_VERSION=$COMMITTED CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

          if [ "$COMMITTED" != "$VERSION" ]; then
            echo "::warning::project.pbxproj at $TAG still says MARKETING_VERSION=$COMMITTED, not $VERSION. The build will bump it on this runner only. Bump and commit the version before tagging, or CURRENT_PROJECT_VERSION may repeat across releases and break Sparkle updates."
          fi

      # A placeholder client id ships a build where sign-in is dead on arrival,
      # and nothing fails at build or run time to tell you.
      - name: Check OAuth client ids are real
        run: |
          UNSET=""
          grep -q 'YOUR_GOOGLE_OAUTH_CLIENT_ID' macos/Fargo/Services/YouTube/YouTubeAuth.swift && UNSET="$UNSET YouTubeAuth.clientId"
          grep -q 'YOUR_TWITCH_CLIENT_ID' macos/Fargo/Services/YouTube/TwitchAuth.swift && UNSET="$UNSET TwitchAuth.clientId"
          grep -q 'YOUR_GOOGLE_OAUTH_CLIENT_ID' macos/Fargo/Info.plist && UNSET="$UNSET Info.plist CFBundleURLSchemes"

          if [ -n "$UNSET" ]; then
            for NAME in $UNSET; do
              echo "::error::$NAME still holds a placeholder. Chat sign-in will not work in this release."
            done
            exit 1
          fi
          echo "OAuth client ids are set."

      # No SwiftPM cache here: build-and-notarize.sh picks its own package
      # checkout directory, so a cache keyed to a path we set is never hit.

      - name: Import Developer ID certificate
        id: keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/fargo-signing.keychain-db
          CERT_PATH: ${{ runner.temp }}/certificate.p12
        run: |
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 did not decode to anything. Re-export the .p12 with 'base64 -i cert.p12 | pbcopy'."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S 'apple-tool:,apple:,codesign:' \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # Keep the default keychains in the search list, otherwise xcodebuild
          # loses access to everything else it needs.
          # shellcheck disable=SC2046  # the existing list must word-split
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate. A Mac Development or Apple Distribution certificate will not work for notarized distribution."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "Signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          SKIP_NOTARIZE=""
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run - passing --skip-notarize."
            SKIP_NOTARIZE="--skip-notarize"
          fi

          chmod +x scripts/*.sh
          # shellcheck disable=SC2086  # $SKIP_NOTARIZE is one optional flag or empty
          ./scripts/build-and-notarize.sh \
            --arch universal \
            --version "$VERSION" \
            --output-dir "$DIST_DIR" \
            $SKIP_NOTARIZE

      - name: Inspect artifacts
        id: artifacts
        run: |
          ZIP="$DIST_DIR/Fargo-$VERSION-universal.zip"
          DMG="$DIST_DIR/Fargo-$VERSION-universal.dmg"

          for FILE in "$ZIP" "$DMG"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Expected artifact is missing: $FILE"
              ls -la "$DIST_DIR" || true
              exit 1
            fi
          done

          WORK="$RUNNER_TEMP/unpacked"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          ditto -x -k "$ZIP" "$WORK"
          APP=$(/usr/bin/find "$WORK" -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle inside $ZIP"
            exit 1
          fi

          # GENERATE_INFOPLIST_FILE=YES, so the version keys exist only in the
          # built app, never in macos/Fargo/Info.plist. If neither it nor
          # pbxproj answers, generate-appcast.sh falls back to its own default.
          PLIST="$APP/Contents/Info.plist"
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" 2>/dev/null || true)
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null || true)

          if [ -z "$BUILD" ]; then
            BUILD=$(sed -n -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/p' \
              macos/Fargo.xcodeproj/project.pbxproj | head -n 1)
            echo "::warning::CFBundleVersion missing from the built app; using CURRENT_PROJECT_VERSION=${BUILD:-unset} from project.pbxproj."
          fi

          echo "Shipping ${SHORT:-unknown} (build ${BUILD:-unknown})"

          if [ -n "$SHORT" ] && [ "$SHORT" != "$VERSION" ]; then
            echo "::warning::CFBundleShortVersionString ($SHORT) does not match the release version ($VERSION)."
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/"* || true

          if [ "$DRY_RUN" != "true" ]; then
            xcrun stapler validate "$APP"
            xcrun stapler validate "$DMG"
            spctl --assess --type execute --verbose=4 "$APP"
          fi

          {
            echo "zip=$ZIP"
            echo "dmg=$DMG"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the update for Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ZIP: ${{ steps.artifacts.outputs.zip }}
        run: |
          RAW=$(./scripts/sign-update.sh "$ZIP" --json)
          # The signature and length are public: both ship in the appcast.
          echo "$RAW"

          # sed -E, not BRE: macOS ships BSD sed, which has no \| alternation.
          SIGNATURE=$(printf '%s' "$RAW" \
            | sed -n -E 's/.*"(edSignature|signature)"[[:space:]]*:[[:space:]]*"([^"]*)".*/\2/p' \
            | head -n 1)
          LENGTH=$(printf '%s' "$RAW" \
            | sed -n -E 's/.*"length"[[:space:]]*:[[:space:]]*"?([0-9]+).*/\1/p' \
            | head -n 1)

          if [ -z "$SIGNATURE" ]; then
            echo "::error::Could not read an EdDSA signature from 'scripts/sign-update.sh --json'. Check SPARKLE_PRIVATE_KEY and the script's JSON shape."
            exit 1
          fi

          echo "Sparkle signature length: ${#SIGNATURE} characters, archive length: ${LENGTH:-unknown} bytes"
          {
            echo "signature=$SIGNATURE"
            echo "length=$LENGTH"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            HEAD_REF="$TAG"
          else
            HEAD_REF="HEAD"
          fi

          # Only strict vX.Y.Z tags count: the repo also carries checkpoint
          # tags like v0.5-native-pipeline.
          PREVIOUS=$(git tag --list 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            | grep -vx "$TAG" \
            | head -n 1 || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$HEAD_REF"
            echo "Collecting commits in $RANGE"
          else
            RANGE="$HEAD_REF"
            echo "No previous tag found - using full history."
          fi

          {
            echo "## What's changed"
            echo
            # shellcheck disable=SC2086  # $RANGE is one or two revs, unquoted on purpose
            git log --no-merges --pretty=format:'- %s (%h)' $RANGE
            echo
            echo
            echo "## Install"
            echo
            echo "Download \`Fargo-$VERSION-universal.dmg\`, drag Fargo to Applications, and launch it."
            echo "The build is a universal binary, signed with a Developer ID certificate and notarized by Apple."
            echo "Requires macOS 14.0 or later. Existing installs update themselves through Sparkle."
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG"
            fi
          } > "$NOTES_PATH"

          cat "$NOTES_PATH"

      - name: Publish GitHub release
        if: needs.preflight.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Fargo ${{ needs.preflight.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/Fargo-*.dmg
            dist/Fargo-*.zip

      - name: Publish appcast to gh-pages
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ZIP: ${{ steps.artifacts.outputs.zip }}
          BUILD: ${{ steps.artifacts.outputs.build }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          REMOTE="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          DOWNLOAD_BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          rm -rf "$PAGES_DIR"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages > /dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages --quiet "$REMOTE" "$PAGES_DIR"
          else
            echo "::notice::gh-pages does not exist yet - creating it."
            mkdir -p "$PAGES_DIR"
            git -C "$PAGES_DIR" init --quiet --initial-branch=gh-pages
            git -C "$PAGES_DIR" remote add origin "$REMOTE"
          fi

          # GitHub Pages runs Jekyll over branch sources unless told not to.
          touch "$PAGES_DIR/.nojekyll"

          BUILD_ARG=""
          if [ -n "$BUILD" ]; then
            BUILD_ARG="--build $BUILD"
          fi

          # shellcheck disable=SC2086  # $BUILD_ARG is one optional flag pair or empty
          ./scripts/generate-appcast.sh \
            --version "$VERSION" \
            $BUILD_ARG \
            --zip "$ZIP" \
            --notes-file "$NOTES_PATH" \
            --appcast "$PAGES_DIR/appcast.xml" \
            --download-url-base "$DOWNLOAD_BASE"

          if [ ! -s "$PAGES_DIR/appcast.xml" ]; then
            echo "::error::scripts/generate-appcast.sh did not write $PAGES_DIR/appcast.xml"
            exit 1
          fi
          python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$PAGES_DIR/appcast.xml"

          # The site lives in site/ so it is reviewable in the repo rather
          # than buried in this workflow.
          cp -R site/. "$PAGES_DIR/"

          git -C "$PAGES_DIR" add -A
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "::notice::gh-pages is already up to date."
            exit 0
          fi
          git -C "$PAGES_DIR" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Publish appcast for $TAG"
          git -C "$PAGES_DIR" push --quiet origin gh-pages

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fargo-${{ needs.preflight.outputs.version }}
          # Distributables and the log only: the output directory also holds a
          # multi-hundred-megabyte .xcarchive and the exported .app.
          path: |
            dist/Fargo-*.dmg
            dist/Fargo-*.zip
            dist/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/fargo-signing.keychain-db
          CERT_PATH: ${{ runner.temp }}/certificate.p12
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$CERT_PATH"
          echo "Temporary signing keychain removed."
