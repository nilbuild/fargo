<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamif</title>
<meta name="description" content="A native macOS app for live streaming. Send your video to several platforms at the same time and record in 4K while you stream.">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:title" content="Streamif">
<meta property="og:description" content="A native macOS app for live streaming. Send your video to several platforms at the same time and record in 4K while you stream.">
<meta property="og:image" content="icon.png">
<meta property="og:type" content="website">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fcfcfd;
    --fg: #0d0d10;
    --muted: #6d6d78;
    --faint: #94949e;
    --line: rgba(0, 0, 0, 0.1);
    --chip: rgba(0, 0, 0, 0.03);
    --accent: #f0402f;
    --accent-hover: #d83322;
    --glow: rgba(240, 64, 47, 0.12);
  }

  @supports (color: color(display-p3 1 1 1)) {
    :root {
      --accent: color(display-p3 0.92041 0.28955 0.22668);
      --accent-hover: color(display-p3 0.82 0.22 0.16);
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08080a;
      --fg: #f4f4f6;
      --muted: #8b8b96;
      --faint: #6a6a75;
      --line: rgba(255, 255, 255, 0.12);
      --chip: rgba(255, 255, 255, 0.05);
      --glow: rgba(240, 64, 47, 0.16);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(44rem 30rem at 50% -6%, var(--glow), transparent 70%);
    pointer-events: none;
  }

  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(3rem, 10vh, 6rem) max(1.5rem, 6vw);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 2.5vw, 1.5rem);
  }

  .brand img {
    width: clamp(3.5rem, 7vw, 5rem);
    height: auto;
    display: block;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.75rem, 6.5vw, 4.5rem);
    line-height: 1;
    letter-spacing: -0.005em;
    font-weight: 600;
  }

  .sub {
    margin: clamp(1.25rem, 3vw, 1.75rem) 0 0;
    max-width: 34ch;
    font-size: clamp(1.0625rem, 1.7vw, 1.25rem);
    line-height: 1.55;
    letter-spacing: -0.01em;
    color: var(--muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    margin-top: clamp(1.75rem, 3.5vw, 2.25rem);
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 550;
    letter-spacing: -0.01em;
    padding: 0.8rem 1.9rem;
    border-radius: 999px;
    transition: background-color 0.18s ease, transform 0.18s ease;
  }

  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }

  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .meta {
    margin: 0.9rem 0 0;
    color: var(--faint);
    font-size: 0.9rem;
  }

  .meta a { color: inherit; text-decoration: none; }
  .meta a:hover { color: var(--fg); }

  .to {
    margin: clamp(3rem, 8vh, 4.5rem) 0 0;
    color: var(--faint);
    font-size: 0.8125rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .logos {
    margin-top: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(1.25rem, 3vw, 2rem);
    color: var(--muted);
  }

  .logos svg { width: 1.75rem; height: 1.75rem; display: block; }

  .rtmp {
    margin: 1.25rem 0 0;
    color: var(--faint);
    font-size: 0.9375rem;
    letter-spacing: -0.01em;
  }

  footer {
    position: relative;
    padding: 0 max(1.5rem, 6vw) clamp(1.75rem, 4vw, 2.5rem);
    text-align: center;
    color: var(--faint);
    font-size: 0.875rem;
  }

  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--fg); }

  .dot { padding: 0 0.55rem; opacity: 0.4; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="icon.png" alt="" width="512" height="512">
      <h1>streamif</h1>
    </div>

    <p class="sub">
      A native macOS app for live streaming. Go live on several platforms at
      the same time, and record in 4K while you stream.
    </p>

    <a class="btn" href="https://github.com/nilbuild/streamif/releases/latest">Download for macOS</a>
    <p class="meta">Free and open source &middot; <a href="https://github.com/nilbuild/streamif">Source on GitHub</a></p>

    <p class="to">Streams to</p>
    <div class="logos">
      <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="YouTube"><title>YouTube</title><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8ZM10 15V9l5.2 3Z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Twitch"><title>Twitch</title><path d="M4.3 3 3 6.3v12.2h4.1V21h2.3l2.3-2.5h3.4L20 14V3Zm1.5 1.5h12.7v8.8l-2.6 2.7h-4.1L9.5 18.5v-2.5H5.8ZM11 7.6v4.6h1.5V7.6Zm4.1 0v4.6h1.5V7.6Z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Kick"><title>Kick</title><path d="M3 3h5v5.5l4-5.5h6l-6 8 6 10h-6l-4-6.5V21H3Z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Facebook"><title>Facebook</title><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12Z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="X"><title>X</title><path d="M13.8 10.6 21.2 2h-1.8l-6.4 7.5L7.9 2H2l7.8 11.3L2 22h1.8l6.8-7.9 5.4 7.9H22Zm-2.4 2.8-.8-1.1L4.4 3.3h2.7l5.1 7.3.8 1.1 6.6 9.4h-2.7Z"/></svg>
    </div>
    <p class="rtmp">and to any other RTMP server</p>
  </main>

  <footer>
    MIT licensed<span class="dot">&middot;</span>Requires macOS 14 or later<span class="dot">&middot;</span><a href="https://github.com/nilbuild/streamif">Source</a><span class="dot">&middot;</span><a href="privacy.html">Privacy</a>
  </footer>
</body>
</html>
